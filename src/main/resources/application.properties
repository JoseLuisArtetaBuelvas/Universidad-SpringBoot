spring.application.name=Universidad - Spring Boot
spring.thymeleaf.cache=false
server.port=8085

# Carga variables de entorno locales desde .env (no versionado); en Render
# las variables se configuran directamente en el dashboard y esta línea no afecta.
spring.config.import=optional:file:.env[.properties]

# Conexión a la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/7502523005_2_Universidad
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Mensajes e Internacionalización
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Configuración de recuperación de clave por correo (API HTTP de Brevo, no SMTP)
# BREVO_API_KEY debe definirse como variable de entorno, nunca en este archivo
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:josex.developer@gmail.com}
brevo.sender.nombre=Universidad - Portal Administrativo
app.base-url=${APP_BASE_URL:http://localhost:8085}