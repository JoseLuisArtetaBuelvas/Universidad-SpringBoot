<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/plantilla :: head}">
    <title>Universidades</title>
</head>
<body>
    <header th:replace="~{layout/plantilla :: header}"></header>

    <div class="container">
        <h1 th:text="#{universidad.reporte.titulo}">Universidades Registradas</h1>
        <a sec:authorize="hasRole('ADMIN')" class="btn btn-primary" th:href="@{/universidades/agregar}" th:text="#{universidad.reporte.boton.agregar}">Agregar Universidad</a>
        <hr/>

        <div th:if="${universidades != null and !universidades.empty}" class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th th:text="#{universidad.columna.nombre}">NOMBRE</th>
                        <th th:text="#{universidad.columna.categoria}">CATEGORÍA</th>
                        <th th:text="#{universidad.columna.web}">WEB</th>
                        <th th:text="#{universidad.columna.rector}">RECTOR</th>
                        <th th:text="#{universidad.columna.email}">EMAIL</th>
                        <th th:text="#{universidad.columna.ciudad}">CIUDAD</th>
                        <th th:text="#{universidad.columna.numeroCarreras}">N.º CARRERAS</th>
                        <th th:text="#{universidad.columna.numSedes}">N.º SEDES</th>
                        <th sec:authorize="hasRole('ADMIN')" th:text="#{reporte.columna.modificar}">MODIFICAR</th>
                        <th sec:authorize="hasRole('ADMIN')" th:text="#{reporte.columna.eliminar}">ELIMINAR</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="universidad : ${universidades}">
                        <td th:text="${universidad.nombre}"></td>
                        <td th:text="${universidad.categoria}"></td>
                        <td th:text="${universidad.web}"></td>
                        <td th:text="${universidad.rector}"></td>
                        <td th:text="${universidad.email}"></td>
                        <td th:text="${universidad.ciudad}"></td>
                        <td th:text="${universidad.numeroCarreras}"></td>
                        <td th:text="${universidad.numSedes}"></td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <a class="btn btn-warning" th:href="@{/universidades/modificar/{id}(id=${universidad.id})}" th:text="#{reporte.boton.modificar}">Modificar</a>
                        </td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <a class="btn btn-danger" th:href="@{/universidades/eliminar/{id}(id=${universidad.id})}" th:text="#{reporte.boton.eliminar}">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${universidades == null or universidades.empty}">
            <p th:text="#{universidad.reporte.vacio}">No hay universidades disponibles.</p>
        </div>
    </div>

    <footer th:replace="~{layout/plantilla :: footer}"></footer>
</body>
</html>
