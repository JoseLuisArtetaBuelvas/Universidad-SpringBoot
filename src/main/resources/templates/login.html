<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/plantilla :: head}">
    <title>Iniciar Sesión</title>
</head>
<body>
    <header th:replace="~{layout/plantilla :: header}"></header>

    <div class="container" style="max-width: 450px; margin-top: 3rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h1 th:text="#{login.titulo}">Iniciar Sesión</h1>
            <p style="color: #64748b;" th:text="#{login.subtitulo}">Universidad - Portal de Acceso</p>
        </div>

        <div th:if="${param.error}" style="background-color: #fee2e2; border: 1px solid #f87171; color: #b91c1c; padding: 12px; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.9rem;">
            <span th:text="#{login.error}">Credenciales incorrectas. Verifique su usuario y contraseña.</span>
        </div>

        <div th:if="${param.logout}" style="background-color: #dcfce7; border: 1px solid #86efac; color: #15803d; padding: 12px; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.9rem;">
            <span th:text="#{login.logout}">Ha cerrado la sesión correctamente.</span>
        </div>

        <div th:if="${param.claveRestablecida}" style="background-color: #dcfce7; border: 1px solid #86efac; color: #15803d; padding: 12px; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.9rem;">
            <span th:text="#{restablecer.exito}">Tu contraseña fue actualizada. Ya puedes iniciar sesión.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username" th:text="#{login.usuario}">Usuario / Cédula:</label>
                <input type="text" id="username" name="username" style="max-width: 100%;" required autofocus/>
            </div>

            <div class="form-group">
                <label for="password" th:text="#{login.clave}">Contraseña:</label>
                <input type="password" id="password" name="password" style="max-width: 100%;" required/>
            </div>

            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 1rem;" th:text="#{login.boton}">Iniciar Sesión</button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 1rem;">
            <a th:href="@{/recuperar}" th:text="#{login.olvideClave}">¿Olvidaste tu contraseña?</a>
        </div>
    </div>
</body>
</html>
