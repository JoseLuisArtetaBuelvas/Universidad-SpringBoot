<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/plantilla :: head}">
    <title>Página de Inicio</title>
</head>
<body>
    <header th:replace="~{layout/plantilla :: header}"></header>

    <div class="container">
        <h1 th:text="#{reporte.titulo}">Página de Inicio</h1>
        <a sec:authorize="hasRole('ADMIN')" class="btn btn-primary" th:href="@{/agregar}" th:text="#{reporte.boton.agregar}">Agregar Usuario</a>
        <p th:text="${mensaje}"></p>
        <hr/>

        <div th:if="${usuario != null}">
            <b th:text="#{reporte.columna.id} + ':'">CÉDULA:</b> <span th:text="${usuario.id}"></span><br/>
            <b th:text="#{reporte.columna.clave} + ':'">CLAVE:</b> <span th:text="${usuario.clave}"></span><br/>
            <b th:text="#{reporte.columna.nombre} + ':'">NOMBRE:</b> <span th:text="${usuario.nombre}"></span><br/>
            <b th:text="#{reporte.columna.email} + ':'">EMAIL:</b> <span th:text="${usuario.email}"></span><br/>
            <b th:text="#{reporte.columna.rol} + ':'">ROL:</b> <span th:text="${usuario.rol}"></span><br/>
        </div>

        <h2 th:text="#{reporte.subtitulo}">Lista de Personas</h2>
        <hr/>
        <div th:if="${usuarios != null and !usuarios.empty}" class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th th:text="#{reporte.columna.id}">CÉDULA</th>
                        <th th:text="#{reporte.columna.clave}">CLAVE</th>
                        <th th:text="#{reporte.columna.nombre}">NOMBRE</th>
                        <th th:text="#{reporte.columna.email}">EMAIL</th>
                        <th th:text="#{reporte.columna.rol}">ROL</th>
                        <th sec:authorize="hasRole('ADMIN')" th:text="#{reporte.columna.modificar}">MODIFICAR</th>
                        <th sec:authorize="hasRole('ADMIN')" th:text="#{reporte.columna.eliminar}">ELIMINAR</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.id}"></td>
                        <td th:text="${usuario.clave}"></td>
                        <td th:text="${usuario.nombre}"></td>
                        <td th:text="${usuario.email}"></td>
                        <td th:text="${usuario.rol}"></td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <a class="btn btn-warning" th:href="@{/modificar/{id}(id=${usuario.id})}" th:text="#{reporte.boton.modificar}">Modificar</a>
                        </td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <a class="btn btn-danger" th:href="@{/eliminar/{id}(id=${usuario.id})}" th:text="#{reporte.boton.eliminar}">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${usuarios == null or usuarios.empty}">
            <p th:text="#{reporte.vacio}">No hay usuarios disponibles.</p>
        </div>
    </div>

    <footer th:replace="~{layout/plantilla :: footer}"></footer>
</body>
</html>
