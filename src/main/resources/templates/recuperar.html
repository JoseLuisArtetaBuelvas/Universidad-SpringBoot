<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/plantilla :: head}">
    <title>Recuperar contraseña</title>
</head>
<body>
    <header th:replace="~{layout/plantilla :: header}"></header>

    <div class="container" style="max-width: 450px; margin-top: 3rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h1 th:text="#{recuperar.titulo}">Recuperar contraseña</h1>
            <p style="color: #64748b;" th:text="#{recuperar.subtitulo}">Te enviaremos un enlace a tu correo para crear una nueva contraseña.</p>
        </div>

        <div th:if="${solicitudEnviada}" style="background-color: #dcfce7; border: 1px solid #86efac; color: #15803d; padding: 12px; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.9rem;">
            <span th:text="#{recuperar.confirmacion}">Si el usuario existe, se envió un correo con las instrucciones para restablecer la contraseña.</span>
        </div>

        <form th:action="@{/recuperar}" method="post">
            <div class="form-group">
                <label for="idOEmail" th:text="#{recuperar.campo.idOEmail}">Cédula o correo electrónico:</label>
                <input type="text" id="idOEmail" name="idOEmail" style="max-width: 100%;" required autofocus/>
            </div>
            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 1rem;" th:text="#{recuperar.boton}">Enviar enlace</button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 1rem;">
            <a th:href="@{/login}" th:text="#{recuperar.volverLogin}">Volver al inicio de sesión</a>
        </div>
    </div>
</body>
</html>
