<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/plantilla :: head}">
    <title>Reportes de usuarios</title>
</head>
<body>
    <header th:replace="~{layout/plantilla :: header}"></header>

    <div class="container">
        <h1 th:text="#{usuario.reportes.titulo}">Reportes de Usuarios</h1>
        <a class="btn btn-secondary" th:href="@{/}" th:text="#{formulario.boton.regresar}">Regresar</a>
        <hr/>

        <h2 th:text="#{usuario.reportes.rol.titulo}">Buscar por rol</h2>
        <form th:action="@{/reportes}" method="get">
            <div class="form-group">
                <label for="rol" th:text="#{formulario.campo.rol}">Rol:</label>
                <select id="rol" name="rol">
                    <option value="" th:text="#{formulario.rol.placeholder}">-- Seleccione un rol --</option>
                    <option value="ADMIN" th:selected="${rol == 'ADMIN'}">ADMIN</option>
                    <option value="USER" th:selected="${rol == 'USER'}">USER</option>
                </select>
            </div>
            <input class="btn btn-primary" type="submit" th:value="#{universidad.reportes.boton.buscar}" value="Buscar"/>
        </form>
        <div th:if="${resultadoRol != null}" class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th th:text="#{reporte.columna.id}">CÉDULA</th>
                        <th th:text="#{reporte.columna.nombre}">NOMBRE</th>
                        <th th:text="#{reporte.columna.email}">EMAIL</th>
                        <th th:text="#{reporte.columna.rol}">ROL</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${resultadoRol}">
                        <td th:text="${usuario.id}"></td>
                        <td th:text="${usuario.nombre}"></td>
                        <td th:text="${usuario.email}"></td>
                        <td th:text="${usuario.rol}"></td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${resultadoRol.empty}" th:text="#{reporte.vacio}">No hay usuarios disponibles.</p>
        </div>

        <hr/>

        <h2 th:text="#{usuario.reportes.nombre.titulo}">Buscar por nombre</h2>
        <form th:action="@{/reportes}" method="get">
            <div class="form-group">
                <label for="nombre" th:text="#{formulario.campo.nombre}">Nombre:</label>
                <input type="text" id="nombre" name="nombre" th:value="${nombre}"/>
            </div>
            <input class="btn btn-primary" type="submit" th:value="#{universidad.reportes.boton.buscar}" value="Buscar"/>
        </form>
        <div th:if="${resultadoNombre != null}" class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th th:text="#{reporte.columna.id}">CÉDULA</th>
                        <th th:text="#{reporte.columna.nombre}">NOMBRE</th>
                        <th th:text="#{reporte.columna.email}">EMAIL</th>
                        <th th:text="#{reporte.columna.rol}">ROL</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${resultadoNombre}">
                        <td th:text="${usuario.id}"></td>
                        <td th:text="${usuario.nombre}"></td>
                        <td th:text="${usuario.email}"></td>
                        <td th:text="${usuario.rol}"></td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${resultadoNombre.empty}" th:text="#{reporte.vacio}">No hay usuarios disponibles.</p>
        </div>
    </div>
</body>
</html>
